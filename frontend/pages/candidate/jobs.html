<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Auth guard: runs before page content, redirects if unauthorized -->
    <script src="../../src/js/auth_guard.js" type="module"></script>
    <script type="module">
        import { requireCandidate } from "../../src/js/auth_guard.js";
        requireCandidate();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Jobs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 antialiased text-slate-900">

    <div id="navbar"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <div class="mb-10 text-center">
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-3">Available Jobs</h1>
            <p class="text-slate-500 max-w-2xl mx-auto">Explore open positions tailored to your expertise and take the
                next step in your career journey.</p>
        </div>

        <!-- The grid styling has been enhanced in the HTML injected by JS below -->
        <div id="jobsContainer" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Loader fallback -->
            <div class="col-span-full text-center py-12 text-slate-500">
                Loading open positions...
            </div>
        </div>

    </main>

    <div id="footer"></div>

    <script src="../../src/js/navbar.js"></script>
    <script>
        loadNavbar("../../components/navbar.html");
    </script>

    <script>
        async function loadJobs() {
            try {
                const response = await fetch("http://127.0.0.1:8000/jobs")
                const jobs = await response.json()
                const container = document.getElementById("jobsContainer")

                container.innerHTML = ""

                if (jobs.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 bg-white rounded-2xl border border-slate-200">No open positions at the moment. Check back later!</div>`;
                    return;
                }

                jobs.forEach(job => {
                    // Improved template literal styling using Tailwind
                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition-all flex flex-col h-full group">
                            <div class="flex-grow">
                                <h2 class="text-xl font-bold text-slate-900 mb-2 group-hover:text-indigo-600 transition-colors">
                                    ${job.title}
                                </h2>
                                <p class="mb-5 text-sm text-slate-600 line-clamp-6 leading-relaxed">
                                    ${job.description}
                                </p>
                                
                                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-100 text-slate-700 text-xs font-semibold mb-4">
                                    <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                    Exp: ${job.experience_level}
                                </div>
                            </div>

                            <button
                                onclick="viewJob(${job.id})"
                                class="mt-2 w-full bg-slate-50 hover:bg-indigo-50 text-indigo-700 font-semibold py-2.5 rounded-lg border border-slate-200 hover:border-indigo-200 transition-colors"
                            >
                                View Details
                            </button>
                        </div>
                    `
                })
            } catch (error) {
                document.getElementById("jobsContainer").innerHTML = `
                    <div class="col-span-full text-center py-12 text-rose-500 bg-white rounded-2xl border border-rose-200">
                        Failed to load jobs. Please check if the server is running.
                    </div>
                `;
            }
        }

        function viewJob(jobId) {
            window.location.href = `job_details.html?id=${jobId}`
        }

        loadJobs()
    </script>
</body>

</html>
