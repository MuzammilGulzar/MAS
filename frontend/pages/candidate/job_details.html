<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Auth guard: runs before page content, redirects if unauthorized -->
    <script src="../../src/js/auth_guard.js" type="module"></script>
    <script type="module">
        import { requireCandidate } from "../../src/js/auth_guard.js";
        requireCandidate();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 antialiased text-slate-900">

    <div id="navbar"></div>
    
    <div class="max-w-4xl mx-auto px-4 py-10 sm:px-6 lg:px-8">
        
        <!-- Go Back Button -->
        <a href="jobs.html" class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-indigo-600 mb-6 transition-colors">
            <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Jobs
        </a>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <!-- Header section of the card -->
            <div class="border-b border-slate-100 p-8 sm:p-10 bg-slate-50/50">
                <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-6">
                    <div>
                        <h1 id="title" class="text-3xl font-extrabold text-slate-900 tracking-tight mb-3">Loading Role...</h1>
                        <div class="flex flex-wrap items-center gap-4 text-sm text-slate-600">
                            <div class="flex items-center gap-1.5">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                <span id="experience">--</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <span class="inline-flex items-center rounded-md bg-indigo-50 px-2 py-1 text-xs font-medium text-indigo-700 ring-1 ring-inset ring-indigo-700/10">Full-Time</span>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="goToApply()" class="shrink-0 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-xl shadow-sm transition-all focus:ring-4 focus:ring-indigo-500/20 w-full sm:w-auto">
                        Apply Now
                    </button>
                </div>
            </div>
            
            <!-- Main Details Content -->
            <div class="p-8 sm:p-10">
                <h3 class="text-lg font-bold text-slate-900 mb-4">About the Role</h3>
                <p id="description" class="text-slate-600 leading-relaxed mb-8 whitespace-pre-line"></p>

                <h3 class="text-lg font-bold text-slate-900 mb-4">Required Skills</h3>
                <div class="bg-slate-50 border border-slate-100 rounded-xl p-5">
                    <p id="skills" class="text-slate-700 font-medium leading-relaxed"></p>
                </div>
            </div>

        </div>

    </div>

    <div id="footer"></div>

    <script src="../../src/js/navbar.js"></script>
    <script>
        loadNavbar("../../components/navbar.html");
    </script>
    <script>
        const params = new URLSearchParams(window.location.search)
        const jobId = params.get("id")

        async function loadJob() {
            try {
                const response = await fetch(`http://127.0.0.1:8000/jobs/${jobId}`)
                const job = await response.json()

                document.getElementById("title").innerText = job.title
                document.getElementById("description").innerText = job.description
                document.getElementById("skills").innerText = job.required_skills
                document.getElementById("experience").innerText = job.experience_level
            } catch (e) {
                document.getElementById("title").innerText = "Job not found"
                document.getElementById("description").innerText = "Unable to fetch job details at this time."
            }
        }

        async function applyJob() {
            const candidateId = 1
            const response = await fetch(
                "http://127.0.0.1:8000/apply",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        candidate_id: candidateId,
                        job_id: Number(jobId)
                    })
                }
            )
            const result = await response.json()
            alert(result.message)
        }

        loadJob()

        function goToApply() {
            window.location.href = `apply.html?id=${jobId}`
        }
    </script>
</body>
</html>
