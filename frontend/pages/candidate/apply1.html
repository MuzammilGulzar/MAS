<!DOCTYPE html>
<html>

<head>
    <title>Apply For Job</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-4xl mx-auto mt-10">

        <div id="navbar"></div>
        <div class="bg-white p-8 rounded-xl shadow">

            <h1 class="text-3xl font-bold mb-6">
                Upload Your Resume
            </h1>

            <input type="file" id="resumeFile" class="mb-4">

            <button onclick="checkEligibility()" class="bg-blue-600 text-white px-6 py-3 rounded">
                Check Eligibility
            </button>

        </div>

        <div id="resultContainer" class="mt-6">
        </div>

    </div>
    <script src="../../src/js/navbar.js"></script>

    <script>
        loadNavbar("../../components/navbar.html");
    </script>
    <script>


        const params =
            new URLSearchParams(
                window.location.search
            )

        const jobId = params.get("id")

        async function checkEligibility() {

            const file =
                document.getElementById(
                    "resumeFile"
                ).files[0]

            if (!file) {
                alert("Please upload resume")
                return
            }

            const formData = new FormData()

            formData.append(
                "file",
                file
            )

            formData.append(
                "job_id",
                jobId
            )

            const token = localStorage.getItem("access_token");

            console.log(localStorage.getItem("access_token"));

            const response =
                await fetch(
                    "http://127.0.0.1:8000/check-eligibility",
                    {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${token}`  
                        },
                        body: formData
                    }
                )

            const result =
                await response.json()

            displayResult(result)
        }

        function displayResult(result) {

            const container =
                document.getElementById(
                    "resultContainer"
                )

            if (result.eligible) {

                container.innerHTML = `
            <div class="bg-green-100 p-6 rounded-xl">

                <h2 class="text-2xl font-bold text-green-700">
                    Eligible
                </h2>

                <p class="mt-3">
                    Score:
                    ${result.score}
                </p>

                <ul class="mt-3">
                    ${result.reasons.map(
                    r => `<li>• ${r}</li>`
                ).join("")}
                </ul>

                <button
                    onclick="startInterview()"
                    class="mt-4 bg-green-600 text-white px-6 py-2 rounded"
                >
                    Start Interview
                </button>

            </div>
        `
            }

            else {

                container.innerHTML = `
            <div class="bg-red-100 p-6 rounded-xl">

                <h2 class="text-2xl font-bold text-red-700">
                    Not Eligible
                </h2>

                <ul class="mt-3">
                    ${result.reasons.map(
                    r => `<li>• ${r}</li>`
                ).join("")}
                </ul>

            </div>
        `
            }
        }

        function startInterview() {

            alert(
                "Interview integration next"
            )
        }

    </script>

</body>

</html>
