<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Auth guard: runs before page content, redirects if unauthorized -->
    <script src="../../src/js/auth_quard.js" type="module"></script>
    <script type="module">
        import { requireHR } from "../../src/js/auth_quard.js";
        requireHR();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Review - MAS HR</title>
    <link rel="stylesheet" href="../../dist/css/tailwind.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <div id="navbar"></div>

    <div class="max-w-5xl mx-auto px-6 py-10">

        <a href="applications.html" class="text-blue-600 hover:underline text-sm mb-6 block">← Back to Applications</a>

        <!-- Loading -->
        <div id="loading" class="bg-white rounded-2xl p-10 text-center shadow-sm">
            <div class="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-3">
            </div>
            <p class="text-gray-500">Loading application...</p>
        </div>

        <!-- Content -->
        <div id="content" class="hidden space-y-6"></div>

    </div>

    <script>

        const params = new URLSearchParams(window.location.search)
        const applicationId = params.get("id")

        async function loadApplication() {
            if (!applicationId) {
                document.getElementById("loading").innerHTML = `<p class="text-red-500">No application ID provided.</p>`
                return
            }

            try {
                const response = await fetch(`http://127.0.0.1:8000/hr/application/${applicationId}`)
                const data = await response.json()

                if (!response.ok) {
                    document.getElementById("loading").innerHTML = `<p class="text-red-500">${data.detail}</p>`
                    return
                }

                document.getElementById("loading").classList.add("hidden")
                renderApplication(data)

            } catch (e) {
                document.getElementById("loading").innerHTML = `<p class="text-red-500">Failed to load. Check backend.</p>`
            }
        }

        function statusBadge(status) {
            const colors = {
                shortlisted: "green", rejected: "red",
                interview_completed: "purple", interview_pending: "blue",
                eligible: "green", ineligible: "red", applied: "gray"
            }
            const color = colors[status] || "gray"
            const label = status ? status.replace(/_/g, " ") : "—"
            return `<span class="bg-${color}-100 text-${color}-700 text-sm px-3 py-1 rounded-full font-medium capitalize">${label}</span>`
        }

        function renderApplication(data) {
            const content = document.getElementById("content")
            content.classList.remove("hidden")

            const report = data.report
            const candidate = data.candidate
            const job = data.job

            const skillRows = report ? Object.entries(report.skill_scores || {}).map(([skill, score]) => {
                const pct = Math.min((score / 10) * 100, 100)
                const barColor = pct >= 70 ? "bg-green-500" : pct >= 50 ? "bg-yellow-500" : "bg-red-500"
                return `
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-600 w-32 truncate">${skill}</span>
                <div class="flex-1 bg-gray-200 rounded-full h-2">
                    <div class="${barColor} h-2 rounded-full" style="width: ${pct}%"></div>
                </div>
                <span class="text-sm font-semibold w-10 text-right">${score.toFixed(1)}/10</span>
            </div>
        `
            }).join("") : ""

            content.innerHTML = `

        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <div class="flex items-start justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Candidate #${candidate.id}</h1>
                    <p class="text-gray-500 text-sm mt-1">Applying for: <strong>${job.title}</strong> · ${job.experience_level || ""}</p>
                </div>
                ${statusBadge(data.status)}
            </div>
        </div>

        <!-- Candidate Info + Eligibility -->
        <div class="grid md:grid-cols-2 gap-4">

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <h2 class="font-bold text-gray-800 mb-4">Resume Analysis</h2>
                <div class="space-y-3">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Resume Score</span>
                        <span class="font-semibold text-gray-900">${candidate.resume_score ? candidate.resume_score + '/100' : '—'}</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Level</span>
                        <span class="font-semibold text-gray-900">${candidate.candidate_level || '—'}</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Best Fit Role</span>
                        <span class="font-semibold text-gray-900">${candidate.job_fit || '—'}</span>
                    </div>
                    ${candidate.resume_score_reason ? `
                    <div class="bg-gray-50 rounded-xl p-3 mt-2">
                        <p class="text-xs text-gray-600 leading-relaxed">${candidate.resume_score_reason}</p>
                    </div>` : ""}
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <h2 class="font-bold text-gray-800 mb-4">Eligibility Check</h2>
                <div class="space-y-3">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Status</span>
                        ${statusBadge(data.eligibility_status)}
                    </div>
                    ${data.eligibility_reason ? `
                    <div class="bg-gray-50 rounded-xl p-3 mt-2">
                        <p class="text-xs text-gray-600 leading-relaxed">${data.eligibility_reason}</p>
                    </div>` : ""}
                </div>
            </div>

        </div>

        ${report ? `

        <!-- Interview Report -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-900">Interview Report</h2>
                <div class="flex items-center gap-3">
                    <span class="text-2xl font-bold text-blue-700">${report.overall_score}/10</span>
                    ${statusBadge(report.recommendation?.toLowerCase().replace(/ /g, '_'))}
                </div>
            </div>

            ${skillRows ? `
            <div class="mb-6">
                <h3 class="font-semibold text-gray-800 mb-3">Skill Scores</h3>
                <div class="space-y-3">${skillRows}</div>
            </div>` : ""}

            <div class="grid md:grid-cols-2 gap-6 mb-6">
                <div>
                    <h3 class="font-semibold text-gray-700 mb-2">✅ Strengths</h3>
                    <ul class="space-y-1">
                        ${(report.strengths || []).map(s => `<li class="text-sm text-gray-600">• ${s}</li>`).join("")}
                    </ul>
                </div>
                <div>
                    <h3 class="font-semibold text-gray-700 mb-2">⚠️ Weaknesses</h3>
                    <ul class="space-y-1">
                        ${(report.weaknesses || []).map(w => `<li class="text-sm text-gray-600">• ${w}</li>`).join("")}
                    </ul>
                </div>
            </div>

            ${report.technical_feedback ? `
            <div class="bg-gray-50 rounded-xl p-4 mb-4">
                <h3 class="font-semibold text-gray-700 mb-1 text-sm">Technical Feedback</h3>
                <p class="text-gray-600 text-sm leading-relaxed">${report.technical_feedback}</p>
            </div>` : ""}

            ${report.final_feedback ? `
            <div class="bg-gray-50 rounded-xl p-4">
                <h3 class="font-semibold text-gray-700 mb-1 text-sm">Final Summary</h3>
                <p class="text-gray-600 text-sm leading-relaxed">${report.final_feedback}</p>
            </div>` : ""}

        </div>` : `

        <div class="bg-gray-50 border border-dashed border-gray-300 rounded-2xl p-8 text-center text-gray-400">
            <p>No interview report yet. The candidate has not completed the interview.</p>
        </div>`}

        <!-- HR Actions -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <h2 class="font-bold text-gray-800 mb-4">HR Decision</h2>
            <p class="text-gray-500 text-sm mb-5">Update this candidate's application status</p>
            <div id="actionMessage" class="hidden mb-4 px-4 py-3 rounded-xl text-sm font-medium"></div>
            <div class="flex flex-wrap gap-3">
                <button onclick="updateStatus('shortlisted')"
                    class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-xl font-medium transition text-sm">
                    ⭐ Shortlist
                </button>
                <button onclick="updateStatus('rejected')"
                    class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded-xl font-medium transition text-sm">
                    ✗ Reject
                </button>
                <button onclick="updateStatus('interview_pending')"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-medium transition text-sm">
                    ↺ Request Re-interview
                </button>
            </div>
        </div>

    `
        }

        async function updateStatus(status) {
            try {
                const response = await fetch(`http://127.0.0.1:8000/hr/application/${applicationId}/status`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ status })
                })

                const data = await response.json()
                const msg = document.getElementById("actionMessage")

                if (response.ok) {
                    msg.className = "block mb-4 px-4 py-3 rounded-xl text-sm font-medium bg-green-50 text-green-700"
                    msg.textContent = `Status updated to: ${status.replace(/_/g, " ")}`
                } else {
                    msg.className = "block mb-4 px-4 py-3 rounded-xl text-sm font-medium bg-red-50 text-red-700"
                    msg.textContent = data.detail || "Update failed"
                }

            } catch (e) {
                alert("Error updating status")
            }
        }

        // Load navbar
        const _ns = document.createElement("script");
        _ns.src = "../../src/js/navbar.js";
        _ns.onload = () => loadNavbar("../../components/navbar.html");
        document.head.appendChild(_ns);

        loadApplication()

    </script>

</body>

</html>
