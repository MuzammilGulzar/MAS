<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Auth guard: runs before page content, redirects if unauthorized -->
    <script src="../../src/js/auth_guard.js" type="module"></script>
    <script type="module">
        import { requireHR } from "../../src/js/auth_guard.js";
        requireHR();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Review - MAS HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen text-slate-900 antialiased">

    <div id="navbar"></div>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-10">

        <a href="applications.html"
            class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-indigo-600 mb-6 transition-colors">
            <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
                </path>
            </svg>
            Back to Applications
        </a>

        <!-- Loading -->
        <div id="loading" class="bg-white rounded-2xl p-12 text-center shadow-sm border border-slate-200">
            <div class="w-10 h-10 border-4 border-slate-100 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4">
            </div>
            <p class="text-slate-500 font-medium">Loading candidate application...</p>
        </div>

        <!-- Content -->
        <div id="content" class="hidden space-y-6"></div>

    </div>

    <div id="footer"></div>

    <script>
        const params = new URLSearchParams(window.location.search)
        const applicationId = params.get("id")

        async function loadApplication() {
            if (!applicationId) {
                document.getElementById("loading").innerHTML = `<p class="text-rose-500 font-medium">No application ID provided.</p>`
                return
            }

            try {
                // const response = await fetch(`http://127.0.0.1:8000/hr/application/${applicationId}`)
                const token = localStorage.getItem("access_token")
                const response = await fetch(`http://127.0.0.1:8000/hr/application/${applicationId}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                })
                const data = await response.json()

                if (!response.ok) {
                    document.getElementById("loading").innerHTML = `<p class="text-rose-500 font-medium">${data.detail}</p>`
                    return
                }

                document.getElementById("loading").classList.add("hidden")
                renderApplication(data)

            } catch (e) {
                document.getElementById("loading").innerHTML = `<p class="text-rose-500 font-medium">Failed to load. Check backend.</p>`
            }
        }

        function statusBadge(status) {
            const colors = {
                shortlisted: "emerald", rejected: "rose",
                interview_completed: "purple", interview_pending: "blue",
                eligible: "emerald", ineligible: "rose", applied: "slate"
            }
            const color = colors[status] || "slate"
            const label = status ? status.replace(/_/g, " ") : "—"
            return `<span class="bg-${color}-50 text-${color}-700 ring-1 ring-inset ring-${color}-600/20 text-xs px-2.5 py-1 rounded-full font-semibold capitalize tracking-wide">${label}</span>`
        }

        function renderApplication(data) {
            const content = document.getElementById("content")
            content.classList.remove("hidden")

            const report = data.report
            const candidate = data.candidate
            const job = data.job

            const skillRows = report ? Object.entries(report.skill_scores || {}).map(([skill, score]) => {
                const pct = Math.min((score / 10) * 100, 100)
                const barColor = pct >= 70 ? "bg-emerald-500" : pct >= 50 ? "bg-amber-500" : "bg-rose-500"
                return `
            <div class="flex items-center gap-4">
                <span class="text-sm font-medium text-slate-700 w-36 truncate">${skill}</span>
                <div class="flex-1 bg-slate-100 rounded-full h-2.5 overflow-hidden">
                    <div class="${barColor} h-2.5 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                </div>
                <span class="text-sm font-bold text-slate-700 w-12 text-right">${score.toFixed(1)}/10</span>
            </div>
        `
            }).join("") : ""

            content.innerHTML = `

        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                <div>
                    <div class="flex items-center gap-3 mb-1">
                        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Candidate #${candidate.id}</h1>
                        ${statusBadge(data.status)}
                    </div>
                    <p class="text-slate-500 text-sm flex items-center gap-2">
                        Applying for: <strong class="text-slate-700">${job.title}</strong> 
                        <span class="w-1 h-1 rounded-full bg-slate-300"></span> 
                        ${job.experience_level || ""}
                    </p>
                </div>
            </div>
        </div>

        <!-- Candidate Info + Eligibility -->
        <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                <h2 class="text-lg font-bold text-slate-900 mb-5 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Resume Analysis
                </h2>
                <div class="space-y-4">
                    <div class="flex justify-between items-center text-sm border-b border-slate-100 pb-3">
                        <span class="text-slate-500 font-medium">Resume Score</span>
                        <span class="font-bold text-slate-900 px-2 py-1 bg-slate-100 rounded-md">${candidate.resume_score ? candidate.resume_score + '/100' : '—'}</span>
                    </div>
                    <div class="flex justify-between items-center text-sm border-b border-slate-100 pb-3">
                        <span class="text-slate-500 font-medium">Level</span>
                        <span class="font-semibold text-slate-900">${candidate.candidate_level || '—'}</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-500 font-medium">Best Fit Role</span>
                        <span class="font-semibold text-slate-900">${candidate.job_fit || '—'}</span>
                    </div>
                    ${candidate.resume_score_reason ? `
                    <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-4 mt-4">
                        <p class="text-sm text-indigo-900 leading-relaxed">${candidate.resume_score_reason}</p>
                    </div>` : ""}
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                <h2 class="text-lg font-bold text-slate-900 mb-5 flex items-center gap-2">
                    <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Eligibility Check
                </h2>
                <div class="space-y-4">
                    <div class="flex justify-between items-center text-sm border-b border-slate-100 pb-3">
                        <span class="text-slate-500 font-medium">Status</span>
                        ${statusBadge(data.eligibility_status)}
                    </div>
                    ${data.eligibility_reason ? `
                    <div class="bg-slate-50 border border-slate-100 rounded-xl p-4 mt-4">
                        <p class="text-sm text-slate-700 leading-relaxed">${data.eligibility_reason}</p>
                    </div>` : ""}
                </div>
            </div>
        </div>

        ${report ? `
        <!-- Interview Report -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4 border-b border-slate-100 pb-6">
                <h2 class="text-xl font-bold text-slate-900">AI Interview Report</h2>
                <div class="flex items-center gap-4 bg-slate-50 px-4 py-2 rounded-xl border border-slate-100">
                    <div class="text-center">
                        <span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-0.5">Overall Score</span>
                        <span class="text-2xl font-extrabold text-indigo-600 leading-none">${report.overall_score}<span class="text-base text-slate-400">/10</span></span>
                    </div>
                    <div class="w-px h-8 bg-slate-200 mx-1"></div>
                    <div>
                        <span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Recommendation</span>
                        ${statusBadge(report.recommendation?.toLowerCase().replace(/ /g, '_'))}
                    </div>
                </div>
            </div>

            ${skillRows ? `
            <div class="mb-8">
                <h3 class="font-bold text-slate-800 mb-4 text-sm uppercase tracking-wider">Skill Assessment</h3>
                <div class="space-y-4 max-w-2xl">${skillRows}</div>
            </div>` : ""}

            <div class="grid md:grid-cols-2 gap-6 mb-8">
                <div class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-5">
                    <h3 class="font-bold text-emerald-800 mb-3 flex items-center gap-2">
                        <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>
                        Strengths
                    </h3>
                    <ul class="space-y-2">
                        ${(report.strengths || []).map(s => `<li class="text-sm text-emerald-700 flex items-start gap-2"><span class="text-emerald-400 mt-0.5">•</span> <span>${s}</span></li>`).join("")}
                    </ul>
                </div>
                <div class="bg-amber-50/50 border border-amber-100 rounded-xl p-5">
                    <h3 class="font-bold text-amber-800 mb-3 flex items-center gap-2">
                        <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        Areas for Improvement
                    </h3>
                    <ul class="space-y-2">
                        ${(report.weaknesses || []).map(w => `<li class="text-sm text-amber-700 flex items-start gap-2"><span class="text-amber-400 mt-0.5">•</span> <span>${w}</span></li>`).join("")}
                    </ul>
                </div>
            </div>

            ${report.technical_feedback ? `
            <div class="bg-slate-50 border border-slate-100 rounded-xl p-6 mb-6">
                <h3 class="font-bold text-slate-800 mb-2 text-sm uppercase tracking-wider">Technical Feedback</h3>
                <p class="text-slate-600 text-sm leading-relaxed">${report.technical_feedback}</p>
            </div>` : ""}

            ${report.final_feedback ? `
            <div class="bg-slate-50 border border-slate-100 rounded-xl p-6">
                <h3 class="font-bold text-slate-800 mb-2 text-sm uppercase tracking-wider">Final Summary</h3>
                <p class="text-slate-600 text-sm leading-relaxed">${report.final_feedback}</p>
            </div>` : ""}
        </div>` : `

        <div class="bg-white border border-dashed border-slate-300 rounded-2xl p-12 text-center shadow-sm">
            <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-1">No Interview Report Yet</h3>
            <p class="text-slate-500 text-sm">The candidate has not completed the AI interview process.</p>
        </div>`}

        <!-- HR Actions -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
            <h2 class="text-lg font-bold text-slate-900 mb-2">HR Decision</h2>
            <p class="text-slate-500 text-sm mb-6">Update this candidate's application status based on their performance.</p>
            
            <div id="actionMessage" class="hidden mb-6 px-4 py-3 rounded-xl text-sm font-medium border"></div>
            
            <div class="flex flex-wrap gap-4">
                <button onclick="updateStatus('shortlisted')"
                    class="bg-emerald-600 hover:bg-emerald-700 focus:ring-4 focus:ring-emerald-500/20 text-white px-6 py-2.5 rounded-xl font-semibold transition-all text-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Shortlist Candidate
                </button>
                <button onclick="updateStatus('rejected')"
                    class="bg-rose-600 hover:bg-rose-700 focus:ring-4 focus:ring-rose-500/20 text-white px-6 py-2.5 rounded-xl font-semibold transition-all text-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    Reject Candidate
                </button>
                <div class="w-px h-10 bg-slate-200 hidden sm:block"></div>
                <button onclick="updateStatus('interview_pending')"
                    class="bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus:ring-4 focus:ring-slate-500/10 px-6 py-2.5 rounded-xl font-semibold transition-all text-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Request Re-interview
                </button>
            </div>
        </div>

    `
        }

        async function updateStatus(status) {
            try {
                const response = await fetch(`http://127.0.0.1:8000/hr/application/${applicationId}/status`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ status })
                })

                const data = await response.json()
                const msg = document.getElementById("actionMessage")

                if (response.ok) {
                    msg.className = "block mb-6 px-4 py-3 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-700 border-emerald-200"
                    msg.textContent = `Success! Status updated to: ${status.replace(/_/g, " ")}`
                } else {
                    msg.className = "block mb-6 px-4 py-3 rounded-xl text-sm font-medium bg-rose-50 text-rose-700 border-rose-200"
                    msg.textContent = data.detail || "Update failed"
                }

            } catch (e) {
                alert("Error updating status")
            }
        }

        // Load navbar
        const _ns = document.createElement("script");
        _ns.src = "../../src/js/navbar.js";
        _ns.onload = () => loadNavbar("../../components/navbar.html");
        document.head.appendChild(_ns);

        loadApplication()

    </script>

</body>

</html>
