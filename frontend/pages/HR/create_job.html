<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../../src/js/auth_guard.js" type="module"></script>
    <script type="module">
        import { requireHR } from "../../src/js/auth_guard.js";
        requireHR();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - MAS HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 min-h-screen text-slate-900 antialiased">

    <div id="navbar"></div>

    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
        <a href="hr_dashboard.html" class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-indigo-600 mb-6 transition-colors">
            <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Dashboard
        </a>

        <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-sm border border-slate-200">
            <div class="mb-8">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2 tracking-tight">Post a New Job</h1>
                <p class="text-slate-500 text-m">Fill in the details. Candidates will be automatically screened by AI against these requirements.</p>
            </div>

            <div id="message" class="hidden mb-6 px-4 py-3 rounded-xl text-sm font-medium border"></div>

            <div class="space-y-6">
                <div>
                    <label class="block text-m font-bold text-slate-700 mb-2">Job Title <span class="text-rose-500">*</span></label>
                    <input type="text" id="title" placeholder="e.g. Python Backend Developer"
                        class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all placeholder:text-slate-400 shadow-sm">
                </div>
                
                <div>
                    <label class="block text-m font-bold text-slate-700 mb-2">Job Description <span class="text-rose-500">*</span></label>
                    <textarea id="description" rows="8" placeholder="Describe the role, responsibilities, and company culture..."
                        class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all placeholder:text-slate-400 shadow-sm resize-none"></textarea>
                </div>
                
                <div>
                    <label class="block text-m font-bold text-slate-700 mb-2">Required Skills <span class="text-rose-500">*</span></label>
                    <input type="text" id="skills" placeholder="e.g. Python, FastAPI, PostgreSQL, Docker"
                        class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all placeholder:text-slate-400 shadow-sm">
                    <p class="text-s text-slate-500 mt-2 flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Separate multiple skills with commas for better AI analysis
                    </p>
                </div>
                
                <div>
                    <label class="block text-m font-bold text-slate-700 mb-2">Experience Level <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <select id="experience"
                            class="w-full appearance-none bg-white border border-slate-300 rounded-xl pl-4 pr-10 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all shadow-sm cursor-pointer text-slate-700">
                            <option value="">Select appropriate level...</option>
                            <option value="Fresher / No Experience">Fresher / No Experience</option>
                            <option value="Entry Level (0-1 years)">Entry Level (0-1 years)</option>
                            <option value="Junior (1-2 years)">Junior (1-2 years)</option>
                            <option value="Mid-Level (2-4 years)">Mid-Level (2-4 years)</option>
                            <option value="Senior (4+ years)">Senior (4+ years)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>
                
                <div class="pt-4 border-t border-slate-100">
                    <button onclick="createJob()" id="submitBtn"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-500/20 text-white py-3.5 rounded-xl font-bold transition-all shadow-sm flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Post Job Listing
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        async function createJob() {
            const title = document.getElementById("title").value.trim()
            const description = document.getElementById("description").value.trim()
            const skills = document.getElementById("skills").value.trim()
            const experience = document.getElementById("experience").value
            const msg = document.getElementById("message")

            if (!title || !description || !skills || !experience) {
                msg.className = "block mb-6 px-4 py-3 rounded-xl text-sm font-medium bg-rose-50 text-rose-700 border border-rose-200"
                msg.textContent = "Please fill in all required fields"
                return
            }

            const token = localStorage.getItem("access_token")
            if (!token) {
                alert("You are not logged in")
                window.location.href = "../../components/login.html"
                return
            }

            const btn = document.getElementById("submitBtn")
            btn.disabled = true
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline-block" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Posting Job...`

            try {
                const response = await fetch("http://127.0.0.1:8000/jobs", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`   
                    },
                    body: JSON.stringify({ title, description, required_skills: skills, experience_level: experience })
                })

                const data = await response.json()

                if (response.ok) {
                    msg.className = "block mb-6 px-4 py-3 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-200"
                    msg.textContent = "Success! Job posted successfully."
                    document.getElementById("title").value = ""
                    document.getElementById("description").value = ""
                    document.getElementById("skills").value = ""
                    document.getElementById("experience").value = ""
                    setTimeout(() => { window.location.href = "hr_dashboard.html" }, 1500)
                } else {
                    msg.className = "block mb-6 px-4 py-3 rounded-xl text-sm font-medium bg-rose-50 text-rose-700 border border-rose-200"
                    msg.textContent = data.detail || "Failed to create job"
                    btn.disabled = false
                    btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Post Job Listing`
                }
            } catch (err) {
                msg.className = "block mb-6 px-4 py-3 rounded-xl text-sm font-medium bg-rose-50 text-rose-700 border border-rose-200"
                msg.textContent = "Cannot connect to server. Please ensure the backend is running."
                btn.disabled = false
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Post Job Listing`
            }
        }

        const _ns = document.createElement("script")
        _ns.src = "../../src/js/navbar.js"
        _ns.onload = () => loadNavbar("../../components/navbar.html")
        document.head.appendChild(_ns)
    </script>
</body>
</html>
