<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../dist/css/tailwind.css">
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

```
<div class="bg-amber-100 p-6 md:p-8 rounded-xl shadow-md w-full max-w-sm">

    <h1 class="text-2xl font-bold text-center mb-6">
        Create Account
    </h1>

    <form id="registerForm">

        <!-- Username -->
        <div class="mb-5">
            <label class="block mb-2 text-sm font-medium text-gray-700">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="john_doe"
                required
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg block w-full px-3 py-2.5 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Email -->
        <div class="mb-5">
            <label class="block mb-2 text-sm font-medium text-gray-700">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="john@example.com"
                required
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg block w-full px-3 py-2.5 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Password -->
        <div class="mb-5">
            <label class="block mb-2 text-sm font-medium text-gray-700">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg block w-full px-3 py-2.5 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Role Selection -->
        <div class="mb-5">
            <label class="block mb-2 text-sm font-medium text-gray-700">
                Register As
            </label>

            <select
                id="role"
                name="role"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg block w-full px-3 py-2.5 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">

                <option value="hr">HR</option>
                <option value="candidate">Candidate</option>
            </select>
        </div>

        <!-- Terms -->
        <div class="flex items-start mb-6">

            <input
                id="terms"
                type="checkbox"
                required
                class="w-4 h-4 mt-1">

            <label
                for="terms"
                class="ml-2 text-sm text-gray-700">

                I agree with the
                <a href="#" class="text-blue-600 hover:underline">
                    terms and conditions
                </a>
            </label>

        </div>

        <!-- Error / Success Message -->
        <p
            id="message"
            class="text-sm mb-4 text-center">
        </p>

        <button
            type="submit"
            class="w-full text-white bg-blue-600 hover:bg-blue-700 rounded-lg text-sm px-4 py-2.5">

            Register

        </button>

        <p class="text-center text-sm mt-4">

            Already have an account?

            <a
                href="login.html"
                class="text-blue-600 hover:underline">

                Login

            </a>

        </p>

    </form>

</div>

<script src="../src/js/register.js"></script>
```

</body>
</html>
