<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>AI Interview System</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-4xl mx-auto p-8">

        <!-- HEADER -->
        <div class="text-center mb-10">
            <h1 class="text-5xl font-bold text-blue-600 mb-4">
                AI Interview System
            </h1>

            <p class="text-gray-600 text-lg">
                Upload your resume and start a skill-based interview
            </p>
        </div>

        <!-- UPLOAD CARD -->
        <div class="bg-white rounded-2xl shadow-lg p-8 mb-8">
            <input
                type="file"
                id="resumeFile"
                accept=".pdf"
                class="mb-6 block w-full border p-3 rounded-lg"
            />

            <button
                onclick="startInterview()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl transition"
            >
                Start Interview
            </button>
        </div>

        <!-- LOADING -->
        <div
            id="loading"
            class="hidden text-center mt-8"
        >
            <p class="text-xl font-semibold text-blue-600">
                Preparing interview...
            </p>
        </div>

        <!-- RESUME SUMMARY -->
        <div
            id="summary"
            class="hidden bg-white rounded-2xl shadow-lg p-6 mb-8"
        >
        </div>

        <!-- CHAT SECTION -->
        <div
            id="chatSection"
            class="hidden bg-white rounded-2xl shadow-lg p-6"
        >
            <h2 class="text-2xl font-bold mb-4 text-blue-600">
                Interview Chat
            </h2>

            <div
                id="chatBox"
                class="border rounded-xl p-4 h-96 overflow-y-auto bg-gray-50 mb-4 space-y-4"
            >
            </div>

            <div class="flex gap-3">
                <input
                    type="text"
                    id="answerInput"
                    placeholder="Type your answer..."
                    class="flex-1 border p-3 rounded-xl"
                />

                <button
                    onclick="submitAnswer()"
                    id="sendButton"
                    class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl transition"
                >
                    Send
                </button>
            </div>
        </div>

        <!-- FINAL REPORT -->
        <div
            id="finalReport"
            class="hidden bg-white rounded-2xl shadow-lg p-6 mt-8"
        >
        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
